<!doctype html>
<html>
<head><meta charset="utf-8"><title>Movie Recap - Demo</title></head>
<body>
  <h1>Movie Recap Demo</h1>
  <input id="q" placeholder="Search a movie..." />
  <button id="search">Search</button>
  <div id="results"></div>
  <h2>Saved Recaps</h2>
  <div id="recaps"></div>

<script>
const api = (p, opts) => fetch(p, opts).then(r => r.json());

document.getElementById('search').onclick = async () => {
  const q = document.getElementById('q').value;
  if (!q) return alert('enter query');
  const data = await api('/api/search?q=' + encodeURIComponent(q));
  const out = document.getElementById('results');
  out.innerHTML = '';
  for (const m of data.results || []) {
    const div = document.createElement('div');
    div.innerHTML = `<b>${m.title}</b> (${m.release_date||''}) - <button data-id="${m.id}" data-title="${m.title}" data-overview="${(m.overview||'').replace(/"/g,'&quot;')}">Generate Recap</button>
    <pre>${m.overview||''}</pre>`;
    out.appendChild(div);
  }
  // attach handlers
  out.querySelectorAll('button').forEach(btn => btn.onclick = async (e) => {
    const id = btn.dataset.id, title = btn.dataset.title, overview = btn.dataset.overview;
    btn.disabled = true;
    btn.textContent = 'Generating...';
    const resp = await api('/api/generate-recap', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ movieId: id, title, overview })
    });
    alert('Recap result:\n' + (resp.content || JSON.stringify(resp)));
    btn.disabled = false;
    btn.textContent = 'Generate Recap';
    loadRecaps();
  });
};

async function loadRecaps() {
  const rows = await api('/api/recaps');
  const out = document.getElementById('recaps');
  out.innerHTML = '';
  for (const r of rows) {
    const d = document.createElement('div');
    d.innerHTML = `<h3>${r.title} <small>by ${r.generated_by}</small></h3><p>${r.content}</p><small>${r.created_at}</small>`;
    out.appendChild(d);
  }
}
loadRecaps();
</script>
</body>
</html>
